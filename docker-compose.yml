services:
  postgres:
    image: postgres:16-alpine
    container_name: pmtrack-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pmtrackdb}
      POSTGRES_USER: ${DB_USERNAME:-pmtrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pmtrack} -d ${DB_NAME:-pmtrackdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: pmtrack-backend
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-pmtrackdb}
      DB_USERNAME: ${DB_USERNAME:-pmtrack}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-jwt-secret-please}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@pmtrack.local}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
      APP_BOOTSTRAP_ADMIN_FULL_NAME: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:-System Administrator}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    container_name: pmtrack-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
