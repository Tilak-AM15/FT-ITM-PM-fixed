server:
  port: ${PORT:10000}
  address: 0.0.0.0
  servlet:
    context-path: /
  forward-headers-strategy: framework

spring:
  application:
    name: pmtrack-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:pmtrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

  seed-demo-data: ${APP_SEED_DEMO_DATA:false}

  scheduler:
    zone: ${APP_SCHEDULER_ZONE:Asia/Kolkata}

  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@pmtrack.local}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
